name: Deploy to WordPress.org

# Publishing a GitHub release ships that version to the WordPress plugin
# directory. Requires two repository secrets: SVN_USERNAME and SVN_PASSWORD.

on:
  release:
    types: [ published ]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to the plugin directory
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: repopress

      - name: Attach the built zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/repopress.zip

  assets:
    name: Update store assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push banner, icon, and screenshots
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: repopress
